<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Khazar Huseynov — Data Science + Economics @ UC Berkeley · Full Merit Scholarship">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="band"><rect x="40" y="235" width="820" height="2" rx="1"/></clipPath>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="248" rx="14"
        fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="40" y="70" font-size="40" font-weight="700" fill="#ffffff" opacity="0">
    Khazar Huseynov
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.1s" dur="0.55s" fill="freeze"/>
  </text>

  <text x="40" y="106" font-size="19" font-weight="600" fill="#e6edf3" opacity="0">
    Data Science + Economics @ UC Berkeley · minor in Maths
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.4s" dur="0.55s" fill="freeze"/>
  </text>

  <g opacity="0">
    <rect x="40" y="122" width="226" height="26" rx="13"
          fill="#f0c674" fill-opacity="0.12" stroke="#f0c674" stroke-opacity="0.45"/>
    <text x="56" y="140" font-size="14" font-weight="600" fill="#f0c674">★ Full Merit Scholarship</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.7s" dur="0.55s" fill="freeze"/>
  </g>

  <text x="40" y="180" font-size="14" fill="#8b949e" opacity="0">
    Quantitative Finance × Applied Machine Learning
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="1.0s" dur="0.55s" fill="freeze"/>
  </text>

  <text x="40" y="212" font-size="15" opacity="0">
    <tspan fill="#8b949e" font-weight="600">Open to:&#160;</tspan><tspan fill="#58a6ff">Data Science · Quantitative Research · ML Internships</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="1.3s" dur="0.55s" fill="freeze"/>
  </text>

  <rect x="40" y="235" width="820" height="2" rx="1" fill="#ffffff" fill-opacity="0.10"/>
  <g clip-path="url(#band)">
    <rect x="0" y="233" width="300" height="6" fill="url(#sheen)">
      <animateTransform attributeName="transform" type="translate" from="-260 0" to="900 0" begin="1.7s" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
