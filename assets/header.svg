<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Khazar Huseynov">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card">
      <rect x="1" y="1" width="898" height="238" rx="14"/>
    </clipPath>

    <clipPath id="line">
      <rect x="56" y="208" width="788" height="2" rx="1"/>
    </clipPath>

    <style>
      text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="898" height="238" rx="14" fill="url(#bg)" stroke="rgba(255,255,255,.08)"/>

  <!-- Ambient glow -->
  <g clip-path="url(#card)">
    <circle cx="815" cy="20" r="180" fill="url(#glow)"/>
  </g>

  <!-- Left accent bar -->
  <rect x="30" y="34" width="4" height="172" rx="2" fill="url(#accent)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".1s" dur=".5s" fill="freeze"/>
  </rect>

  <!-- Name -->
  <text x="56" y="58" font-size="40" font-weight="700" fill="#ffffff" opacity="0">
    Khazar Huseynov
    <animate attributeName="opacity" from="0" to="1" dur=".5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur=".5s" fill="freeze"/>
  </text>

  <!-- Role -->
  <text x="56" y="88" font-size="18" font-weight="600" fill="#E6EDF3" opacity="0">
    Data Science + Economics @ UC Berkeley &#183; Minor in Mathematics
    <animate attributeName="opacity" from="0" to="1" begin=".2s" dur=".5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin=".2s" dur=".5s" fill="freeze"/>
  </text>

  <!-- Class year + window -->
  <text x="56" y="112" font-size="14" font-weight="500" opacity="0">
    <tspan fill="#8B949E">Class of 2029 &#183; Seeking </tspan>
    <tspan fill="#58A6FF" font-weight="600">Summer 2027</tspan>
    <tspan fill="#8B949E"> internships</tspan>
    <animate attributeName="opacity" from="0" to="1" begin=".35s" dur=".5s" fill="freeze"/>
  </text>

  <!-- Badge: Full Merit Scholarship -->
  <g opacity="0">
    <rect x="56" y="128" width="192" height="28" rx="14" fill="#f0c67418" stroke="#f0c67480"/>
    <text x="152" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#f0c674">Full Merit Scholarship</text>
    <animate attributeName="opacity" from="0" to="1" begin=".5s" dur=".5s" fill="freeze"/>
  </g>

  <!-- Badge: ISEF Finalist -->
  <g opacity="0">
    <rect x="262" y="128" width="120" height="28" rx="14" fill="#f0c67418" stroke="#f0c67480"/>
    <text x="322" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#f0c674">ISEF Finalist</text>
    <animate attributeName="opacity" from="0" to="1" begin=".65s" dur=".5s" fill="freeze"/>
  </g>

  <!-- Open to (with status dot) -->
  <g opacity="0">
    <circle cx="61" cy="181" r="5" fill="#3fb950"/>
    <circle cx="61" cy="181" r="5" fill="none" stroke="#3fb950">
      <animate attributeName="r" from="5" to="11" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".6" to="0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="186" font-size="15">
      <tspan fill="#8B949E" font-weight="600">Open to:</tspan>
      <tspan fill="#58A6FF"> Quant Research &#183; Machine Learning &#183; Data Science Internships</tspan>
    </text>
    <animate attributeName="opacity" from="0" to="1" begin=".85s" dur=".5s" fill="freeze"/>
  </g>

  <!-- Divider + sheen -->
  <rect x="56" y="208" width="788" height="2" rx="1" fill="#ffffff22"/>
  <g clip-path="url(#line)">
    <rect x="-250" y="206" width="250" height="6" fill="url(#sheen)">
      <animateTransform attributeName="transform" type="translate" from="-250 0" to="1050 0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
