<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Khazar Huseynov">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fbfcfc"/>
      <stop offset="100%" stop-color="#eef2f1"/>
    </linearGradient>

    <linearGradient id="curveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="72%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card">
      <rect x="1" y="1" width="898" height="238" rx="16"/>
    </clipPath>

    <style>
      .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      .mono { font-family:"SFMono-Regular",ui-monospace,"JetBrains Mono",Consolas,monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#bg)" stroke="rgba(0,0,0,.09)"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="900" height="240" fill="url(#glow)"/>

    <!-- graph-paper grid -->
    <g stroke="#0f172a" stroke-opacity=".045" stroke-width="1">
      <line x1="140" y1="0" x2="140" y2="240"/>
      <line x1="280" y1="0" x2="280" y2="240"/>
      <line x1="420" y1="0" x2="420" y2="240"/>
      <line x1="560" y1="0" x2="560" y2="240"/>
      <line x1="700" y1="0" x2="700" y2="240"/>
      <line x1="840" y1="0" x2="840" y2="240"/>
      <line x1="0" y1="70" x2="900" y2="70"/>
      <line x1="0" y1="140" x2="900" y2="140"/>
    </g>

  </g>

  <!-- left accent tick -->
  <rect x="30" y="30" width="3" height="150" rx="1.5" fill="url(#accentBar)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".05s" dur=".5s" fill="freeze"/>
  </rect>

  <!-- kicker -->
  <text x="56" y="42" class="mono" font-size="11" letter-spacing="2.5" fill="#0d9488" opacity="0">
    QUANT &#183; MACHINE LEARNING &#183; DATA SCIENCE
    <animate attributeName="opacity" from="0" to=".95" dur=".5s" fill="freeze"/>
  </text>

  <!-- name -->
  <text x="55" y="82" class="sans" font-size="40" font-weight="800" fill="#0f1e1a" opacity="0">
    Khazar Huseynov
    <animate attributeName="opacity" from="0" to="1" begin=".12s" dur=".5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin=".12s" dur=".5s" fill="freeze"/>
  </text>
  <rect x="360" y="59" width="11" height="26" fill="#0d9488" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.35;0.36" dur=".7s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin=".9s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="56" y="110" class="sans" font-size="17" font-weight="600" fill="#35433f" opacity="0">
    Data Science + Economics @ UC Berkeley &#183; Minor in Mathematics
    <animate attributeName="opacity" from="0" to="1" begin=".26s" dur=".5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin=".26s" dur=".5s" fill="freeze"/>
  </text>

  <!-- class line -->
  <text x="56" y="132" class="sans" font-size="13.5" font-weight="500" opacity="0">
    <tspan fill="#6b7a76">Class of 2029 &#183; Seeking </tspan>
    <tspan fill="#0d9488" font-weight="700">Summer 2027</tspan>
    <tspan fill="#6b7a76"> internships</tspan>
    <animate attributeName="opacity" from="0" to="1" begin=".4s" dur=".5s" fill="freeze"/>
  </text>

  <!-- badges -->
  <g opacity="0">
    <rect x="56" y="146" width="190" height="26" rx="6" fill="#b7791f14" stroke="#b7791f66"/>
    <text x="151" y="163.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#a16207">Full Merit Scholarship</text>
    <animate attributeName="opacity" from="0" to="1" begin=".55s" dur=".5s" fill="freeze"/>
  </g>
  <g opacity="0">
    <rect x="256" y="146" width="112" height="26" rx="6" fill="#0d948814" stroke="#0d948866"/>
    <text x="312" y="163.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#0f766e">ISEF Finalist</text>
    <animate attributeName="opacity" from="0" to="1" begin=".68s" dur=".5s" fill="freeze"/>
  </g>

  <!-- open to -->
  <g opacity="0">
    <circle cx="61" cy="196" r="4.5" fill="#0d9488"/>
    <circle cx="61" cy="196" r="4.5" fill="none" stroke="#0d9488">
      <animate attributeName="r" from="4.5" to="11" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".6" to="0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="200" class="sans" font-size="14">
      <tspan fill="#6b7a76" font-weight="600">Open to</tspan>
      <tspan fill="#a9b6b1">&#160;&#8594;&#160;</tspan>
      <tspan fill="#35433f">Quant Research</tspan>
      <tspan fill="#a9b6b1">&#160;&#183;&#160;</tspan>
      <tspan fill="#35433f">Machine Learning</tspan>
      <tspan fill="#a9b6b1">&#160;&#183;&#160;</tspan>
      <tspan fill="#35433f">Data Science Internships</tspan>
    </text>
    <animate attributeName="opacity" from="0" to="1" begin=".82s" dur=".5s" fill="freeze"/>
  </g>

  <!-- axis baseline -->
  <line x1="56" y1="216" x2="844" y2="216" stroke="#0f172a" stroke-opacity=".13"/>
  <g stroke="#0d9488" stroke-opacity=".5" stroke-width="1.5">
    <line x1="56" y1="213" x2="56" y2="219"/>
    <line x1="450" y1="214" x2="450" y2="218"/>
    <line x1="844" y1="213" x2="844" y2="219"/>
  </g>
</svg>
