<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Khazar Huseynov">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="line">
      <rect x="50" y="224" width="800" height="2" rx="1"/>
    </clipPath>

    <style>
      text {
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      }
    </style>
  </defs>

  <rect
      x="1"
      y="1"
      width="898"
      height="248"
      rx="14"
      fill="url(#bg)"
      stroke="rgba(255,255,255,.08)"
  />

  <!-- Name -->

  <text
      x="50"
      y="64"
      font-size="40"
      font-weight="700"
      fill="white"
      opacity="0">

      Khazar Huseynov

      <animate attributeName="opacity"
               from="0"
               to="1"
               dur=".5s"
               fill="freeze"/>

      <animateTransform
          attributeName="transform"
          type="translate"
          from="0 12"
          to="0 0"
          dur=".5s"
          fill="freeze"/>

  </text>

  <!-- Subtitle -->

  <text
      x="50"
      y="100"
      font-size="20"
      font-weight="600"
      fill="#E6EDF3"
      opacity="0">

      Data Science + Economics @ UC Berkeley · Minor in Mathematics

      <animate attributeName="opacity"
               from="0"
               to="1"
               begin=".25s"
               dur=".5s"
               fill="freeze"/>

      <animateTransform
          attributeName="transform"
          type="translate"
          from="0 12"
          to="0 0"
          begin=".25s"
          dur=".5s"
          fill="freeze"/>

  </text>

  <!-- Badge 1 -->

  <g opacity="0">

      <rect
          x="50"
          y="122"
          width="214"
          height="28"
          rx="14"
          fill="#f0c67420"
          stroke="#f0c67480"/>

      <text
          x="65"
          y="141"
          font-size="14"
          font-weight="700"
          fill="#f0c674">

          ★ Full Merit Scholarship

      </text>

      <animate attributeName="opacity"
               from="0"
               to="1"
               begin=".55s"
               dur=".5s"
               fill="freeze"/>

  </g>

  <!-- Badge 2 -->

  <g opacity="0">

      <rect
          x="278"
          y="122"
          width="148"
          height="28"
          rx="14"
          fill="#f0c67420"
          stroke="#f0c67480"/>

      <text
          x="294"
          y="141"
          font-size="14"
          font-weight="700"
          fill="#f0c674">

          ★ ISEF Finalist

      </text>

      <animate attributeName="opacity"
               from="0"
               to="1"
               begin=".75s"
               dur=".5s"
               fill="freeze"/>

  </g>

  <!-- Research interests -->

  <text
      x="50"
      y="182"
      font-size="15"
      fill="#8B949E"
      opacity="0">

      Quantitative Finance × Machine Learning × Causal Inference

      <animate attributeName="opacity"
               from="0"
               to="1"
               begin="1s"
               dur=".5s"
               fill="freeze"/>

  </text>

  <!-- Looking for -->

  <text
      x="50"
      y="206"
      font-size="15"
      opacity="0">

      <tspan fill="#8B949E" font-weight="600">
          Open to:
      </tspan>

      <tspan fill="#58A6FF">
          Quant Research · Machine Learning · Data Science
      </tspan>

      <animate attributeName="opacity"
               from="0"
               to="1"
               begin="1.25s"
               dur=".5s"
               fill="freeze"/>

  </text>

  <rect
      x="50"
      y="224"
      width="800"
      height="2"
      rx="1"
      fill="#ffffff22"/>

  <g clip-path="url(#line)">
      <rect
          x="-250"
          y="222"
          width="250"
          height="6"
          fill="url(#sheen)">

          <animateTransform
              attributeName="transform"
              type="translate"
              from="-250 0"
              to="1050 0"
              dur="3s"
              repeatCount="indefinite"/>

      </rect>
  </g>

</svg>
