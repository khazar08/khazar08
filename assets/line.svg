<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 8" width="900" height="8" preserveAspectRatio="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="band">
      <rect x="0" y="3" width="900" height="2" rx="1"/>
    </clipPath>
  </defs>

  <rect x="0" y="3" width="900" height="2" rx="1" fill="#ffffff" fill-opacity="0.25"/>

  <g clip-path="url(#band)">
    <rect x="0" y="0" width="320" height="8" fill="url(#sheen)">
      <animateTransform attributeName="transform"
                        type="translate"
                        from="-320 0" to="900 0"
                        dur="2.6s"
                        repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
